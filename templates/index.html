<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LexiCode - Lexical Analyzer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>LexiCode</h1>
        <p>Mini Lexical Analyzer</p>
    </header>

    <main>

        <section class="editor-section">

            <div class="section-header">
                <h2>Enter Your Code</h2>

                <select id="language">
                    <option value="cpp">C++</option>
                    <option value="python">Python</option>
                </select>
            </div>

            <textarea id="codeInput" placeholder="Write or paste your code here...">int age = 20;

if (age >= 18) {
    cout << "Adult";
}</textarea>

            <button id="analyzeBtn">Analyze Code</button>

        </section>


        <section class="results-section">

            <div class="section-header">
                <h2>Token Results</h2>
                <span id="tokenCount">0 Tokens</span>
            </div>

            <div class="table-container">

                <table>
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Lexeme</th>
                            <th>Token</th>
                            <th>Line</th>
                        </tr>
                    </thead>

                    <tbody id="tokenTable">
                        <tr>
                            <td colspan="4" class="empty">
                                Click "Analyze Code" to see tokens
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <footer>
        <p>LexiCode &copy; 2026 | Compiler Construction Project</p>
    </footer>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
